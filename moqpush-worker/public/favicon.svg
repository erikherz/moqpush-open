<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background circle -->
    <circle cx="50" cy="50" r="48" fill="url(#bgGradient)"/>
    <!-- Stylized "Q" letterform -->
    <circle cx="48" cy="44" r="22" fill="none" stroke="url(#letterGradient)" stroke-width="7" opacity="0.95"/>
    <!-- Q tail / push arrow pointing right and down -->
    <path d="M62 58 L78 74" stroke="url(#letterGradient)" stroke-width="7" stroke-linecap="round" opacity="0.95"/>
    <!-- Arrow head on the tail -->
    <path d="M72 76 L78 74 L76 68" stroke="url(#letterGradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95"/>
    <!-- Signal/broadcast waves -->
    <path d="M75 30 Q82 36 75 42" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.4"/>
    <path d="M80 26 Q90 36 80 46" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.25"/>
    <!-- Shine -->
    <ellipse cx="36" cy="32" rx="10" ry="6" fill="white" opacity="0.12" transform="rotate(-30 36 32)"/>
    <defs>
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4c1d95"/>
            <stop offset="50%" stop-color="#6d28d9"/>
            <stop offset="100%" stop-color="#7c3aed"/>
        </linearGradient>
        <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e9d5ff"/>
            <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>
    </defs>
</svg>
