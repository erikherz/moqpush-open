<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>MoQpush stats</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0a; color: #e5e5e5; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #1a1a1a; }
    .header h1 { font-size: 1.2em; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }
    .header h1 .logo-icon { width: 28px; height: 28px; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5)); }
    .header h1 .logo-text { background: linear-gradient(135deg, #60a5fa 0%, #34d399 50%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header a { color: #737373; text-decoration: none; font-size: 0.9em; }
    .header a:hover { color: #e5e5e5; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
    .status-dot.on { background: #4ade80; }
    .status-dot.off { background: #ef4444; }
    .content { max-width: 1000px; margin: 0 auto; padding: 24px; }
    .empty { text-align: center; color: #525252; padding: 60px 0; }

    .ns-card { border: 1px solid #1a1a1a; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .ns-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: pointer; background: #111; }
    .ns-header:hover { background: #171717; }
    .ns-name { font-family: monospace; font-weight: 600; font-size: 1em; }
    .ns-badges { display: flex; gap: 8px; }
    .badge { font-size: 0.7em; padding: 2px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .badge.on { background: #166534; color: #4ade80; }
    .badge.off { background: #1c1917; color: #525252; }
    .chevron { color: #525252; transition: transform 0.2s; font-size: 0.9em; }
    .chevron.open { transform: rotate(90deg); }

    .ns-body { display: none; padding: 16px; border-top: 1px solid #1a1a1a; }
    .ns-body.open { display: block; }

    .role-section { margin-bottom: 16px; }
    .role-label { font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.1em; color: #737373; margin-bottom: 8px; font-weight: 600; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .stat { background: #171717; border-radius: 6px; padding: 8px 10px; }
    .stat-label { font-size: 0.65em; text-transform: uppercase; letter-spacing: 0.05em; color: #737373; margin-bottom: 2px; }
    .stat-value { font-family: monospace; font-size: 0.95em; }
    .stat-value.warn { color: #fbbf24; }
    .stat-value.err { color: #f87171; }
    .stat-value.good { color: #4ade80; }

    .updated { font-size: 0.7em; color: #525252; margin-top: 6px; text-align: right; }
    .warm-section { margin-top: 12px; }
    .warm-grid { display: flex; gap: 6px; flex-wrap: wrap; }
    .warm-chip { font-size: 0.7em; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
    .warm-chip.warm { background: #1e3a5f; color: #60a5fa; }
    .warm-chip.pending { background: #3b2f1a; color: #fbbf24; }
    .warm-chip.cold { background: #1c1917; color: #525252; }
    .catalog-toggle { font-size: 0.75em; color: #737373; cursor: pointer; margin-top: 8px; user-select: none; }
    .catalog-toggle:hover { color: #e5e5e5; }
    .catalog-pre { background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 6px; padding: 12px; margin-top: 6px; font-family: monospace; font-size: 0.75em; color: #a3a3a3; overflow-x: auto; white-space: pre; display: none; }
    .catalog-pre.open { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>
        <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="48" fill="url(#oG)"/><path d="M30 25c5-3 15-5 20 0s10 10 5 18c-3 5-10 8-15 5s-12-8-15-13c-2-4 0-8 5-10z" fill="url(#lG)" opacity="0.9"/><path d="M55 30c8-2 18 2 22 10s2 20-8 25c-8 4-15 0-18-8s-4-15 0-20c2-4 6-6 4-7z" fill="url(#lG)" opacity="0.9"/><path d="M25 50c3-2 10-1 15 3s8 12 5 18c-2 5-8 8-14 6s-10-8-10-15c0-5 2-10 4-12z" fill="url(#lG)" opacity="0.9"/><path d="M60 60c5-1 12 2 15 8s2 14-5 18c-5 3-12 1-15-5s-3-12 0-16c2-3 3-4 5-5z" fill="url(#lG)" opacity="0.9"/><circle cx="50" cy="50" r="48" fill="none" stroke="url(#aG)" stroke-width="3" opacity="0.6"/><ellipse cx="35" cy="30" rx="12" ry="8" fill="white" opacity="0.15" transform="rotate(-30 35 30)"/><defs><linearGradient id="oG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e40af"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient><linearGradient id="lG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient><linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs></svg>
        <span class="status-dot off" id="ws-dot"></span>
        <span class="logo-text">MoQpush</span> stats
      </h1>
    </div>
    <div>
      <a href="/admin">Admin</a>
    </div>
  </div>

  <div class="content" id="content">
    <div class="empty" id="empty">No active streams</div>
  </div>

  <script>
    let ws = null;
    let pullerWs = null;
    let data = {};
    let pullerStatus = {};

    function fmtBytes(b) {
      if (b == null) return '-';
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
      return (b / 1073741824).toFixed(2) + ' GB';
    }

    function fmtUptime(s) {
      if (s == null) return '-';
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = Math.floor(s % 60);
      return `${h}h ${m}m ${sec}s`;
    }

    // --- In-place DOM update helpers ---
    // Every stat tile gets a unique data-sid attribute. On update, we find existing
    // tiles by data-sid and patch textContent/className instead of rebuilding innerHTML.
    // This keeps expandable panels (Shaka Config, Video Structure, etc.) stable.

    function stat(sid, label, value, cls) {
      return `<div class="stat" data-sid="${sid}"><div class="stat-label">${label}</div><div class="stat-value ${cls || ''}">${value ?? '-'}</div></div>`;
    }

    function updateStat(container, sid, value, cls) {
      const el = container.querySelector(`[data-sid="${sid}"] .stat-value`);
      if (el) {
        if (el.innerHTML !== String(value ?? '-')) el.innerHTML = String(value ?? '-');
        el.className = 'stat-value ' + (cls || '');
      }
    }

    // Build the initial HTML for a namespace body (called once on first open)
    function buildNsBody(ns, entry) {
      let html = '';

      // Publisher section
      if (entry.publisher) {
        const d = entry.publisher;
        html += `<div class="role-section" data-role="publisher"><div class="role-label">Publisher</div><div class="stat-grid">`;
        html += stat('pub-uptime', 'Uptime', fmtUptime(d.uptime_secs));
        html += stat('pub-tracks', 'Tracks', d.tracks ?? '-');
        html += stat('pub-published', 'Published', fmtBytes(d.bytes_published));
        html += stat('pub-bitrate', 'Bitrate', d.bitrate_mbps != null ? d.bitrate_mbps.toFixed(2) + ' Mbps' : '-');
        html += stat('pub-frames', 'Frames', d.frames_sent != null ? d.frames_sent.toLocaleString() : '-');
        html += stat('pub-segments', 'Segments', d.segments_sent != null ? d.segments_sent.toLocaleString() : '-');
        html += stat('pub-resolution', 'Resolution', (d.video_width && d.video_height) ? d.video_width + 'x' + d.video_height : '-');
        html += stat('pub-vcodec', 'Video Codec', d.video_codec ?? '-');
        html += stat('pub-acodec', 'Audio Codec', d.audio_codec ?? '-');
        html += stat('pub-rtt', 'RTT', d.transport?.rtt_ms != null ? d.transport.rtt_ms.toFixed(1) + ' ms' : '-');
        html += stat('pub-tx', 'TX', fmtBytes(d.transport?.bytes_sent));
        html += stat('pub-rx', 'RX', fmtBytes(d.transport?.bytes_received));
        html += stat('pub-pktloss', 'Pkt Loss', d.transport?.packets_lost != null ? d.transport.packets_lost.toLocaleString() : '-');
        html += stat('pub-sendrate', 'Send Rate', d.transport?.estimated_send_rate_mbps != null ? d.transport.estimated_send_rate_mbps.toFixed(1) + ' Mbps' : '-');
        html += '</div>';

        // Expandable panels
        if (d.video_structure) {
          const vsId = 'vs-' + ns.replace(/\W/g, '');
          html += `<div class="catalog-toggle" onclick="document.getElementById('${vsId}').classList.toggle('open')">Video Structure</div>`;
          html += `<pre class="catalog-pre" id="${vsId}" style="line-height:1.8" data-panel="vs"></pre>`;
        }
        const catId = 'cat-' + ns.replace(/\W/g, '');
        html += `<div class="catalog-toggle" onclick="document.getElementById('${catId}').classList.toggle('open')">MSF Catalog</div>`;
        html += `<pre class="catalog-pre" id="${catId}" data-panel="catalog"></pre>`;

        const trId = 'tr-' + ns.replace(/\W/g, '');
        html += `<div class="catalog-toggle" onclick="document.getElementById('${trId}').classList.toggle('open')">Transport (QUIC)</div>`;
        html += `<pre class="catalog-pre" id="${trId}" data-panel="transport"></pre>`;

        html += `<div class="updated" data-role="pub-updated"></div>`;
        html += '</div>';
      }

      // Player sections
      if (entry.players) {
        for (const [pt, pd] of Object.entries(entry.players).sort()) {
          html += buildPlayerSection(pt, pd, ns);
        }
      }

      // Warm status
      html += `<div data-role="warm"></div>`;

      return html;
    }

    function buildPlayerSection(playerType, d, ns) {
      const prefix = 'p-' + playerType + '-';
      const typeName = playerType.charAt(0).toUpperCase() + playerType.slice(1);
      const viewerLabel = d.viewer_count > 1 ? ` (${d.viewer_count} viewers, avg)` : '';
      let html = `<div class="role-section" data-role="player-${playerType}"><div class="role-label" data-plabel="${playerType}">${typeName} Player${viewerLabel}</div><div class="stat-grid">`;
      html += stat(prefix + 'uptime', 'Uptime', fmtUptime(d.uptime_secs));
      html += stat(prefix + 'viewers', 'Viewers', d.viewer_count ?? '-', d.viewer_count > 0 ? 'good' : '');
      html += stat(prefix + 'buffer', 'Buffer', d.buffer_health != null ? d.buffer_health.toFixed(2) + 's' : '-');
      html += stat(prefix + 'latency', 'Latency', d.latency != null ? d.latency.toFixed(2) + 's' : '-');
      html += stat(prefix + 'resolution', 'Resolution', (d.width && d.height) ? d.width + 'x' + d.height : '-');
      html += stat(prefix + 'bitrate', 'Bitrate', d.bitrate_mbps != null ? d.bitrate_mbps.toFixed(1) + ' Mbps' : '-');
      html += stat(prefix + 'estbw', 'Est. BW', (d.estimated_bandwidth != null && d.estimated_bandwidth > 0) ? d.estimated_bandwidth.toFixed(1) + ' Mbps' : '-');
      html += stat(prefix + 'vcodec', 'Video Codec', d.video_codec ?? '-');
      html += stat(prefix + 'acodec', 'Audio Codec', d.audio_codec ?? '-');
      html += stat(prefix + 'dropped', 'Dropped', d.dropped_frames ?? '-', (d.dropped_frames > 0) ? 'warn' : '');
      html += stat(prefix + 'loadtime', 'Load Time', (d.load_latency != null && d.load_latency > 0) ? d.load_latency.toFixed(2) + 's' : '-');
      html += stat(prefix + 'rebuffer', 'Rebuffer', (d.buffering_time != null && d.buffering_time > 0) ? d.buffering_time.toFixed(1) + 's' : '-', (d.buffering_time > 2) ? 'warn' : '');
      html += stat(prefix + 'playtime', 'Play Time', (d.play_time != null && d.play_time > 0) ? fmtUptime(d.play_time) : '-');
      html += stat(prefix + 'switches', 'Switches', (d.switch_count != null && d.switch_count > 0) ? d.switch_count : '-');
      html += stat(prefix + 'framesrx', 'Frames RX', d.frames_received != null ? d.frames_received.toLocaleString() : '-');
      html += stat(prefix + 'bytesrx', 'Bytes RX', d.bytes_received != null ? fmtBytes(d.bytes_received) : '-');
      const relayFull = d.relay || '';
      const relayShort = relayFull.length > 15 ? relayFull.slice(0, 15) + '…' : relayFull;
      html += stat(prefix + 'relay', 'Relay', relayFull ? `<span title="${relayFull}">${relayShort}</span>` : '-');
      html += '</div>';

      if (d.shaka_config) {
        const cfgId = 'cfg-' + playerType + '-' + ns.replace(/\W/g, '');
        html += `<div class="catalog-toggle" onclick="document.getElementById('${cfgId}').classList.toggle('open')">Shaka Config</div>`;
        html += `<pre class="catalog-pre" id="${cfgId}" data-panel="shaka-cfg-${playerType}"></pre>`;
      }

      html += `<div class="updated" data-role="${playerType}-updated"></div>`;
      html += '</div>';
      return html;
    }

    // Update all values in-place without rebuilding DOM
    function updateNsBody(ns, entry, body) {
      // Publisher
      if (entry.publisher) {
        const d = entry.publisher;
        updateStat(body, 'pub-uptime', fmtUptime(d.uptime_secs));
        updateStat(body, 'pub-tracks', d.tracks ?? '-');
        updateStat(body, 'pub-published', fmtBytes(d.bytes_published));
        updateStat(body, 'pub-bitrate', d.bitrate_mbps != null ? d.bitrate_mbps.toFixed(2) + ' Mbps' : '-');
        updateStat(body, 'pub-frames', d.frames_sent != null ? d.frames_sent.toLocaleString() : '-');
        updateStat(body, 'pub-segments', d.segments_sent != null ? d.segments_sent.toLocaleString() : '-');
        updateStat(body, 'pub-resolution', (d.video_width && d.video_height) ? d.video_width + 'x' + d.video_height : '-');
        updateStat(body, 'pub-vcodec', d.video_codec ?? '-');
        updateStat(body, 'pub-acodec', d.audio_codec ?? '-');
        updateStat(body, 'pub-rtt', d.transport?.rtt_ms != null ? d.transport.rtt_ms.toFixed(1) + ' ms' : '-', d.transport?.rtt_ms > 100 ? 'warn' : 'good');
        updateStat(body, 'pub-tx', fmtBytes(d.transport?.bytes_sent));
        updateStat(body, 'pub-rx', fmtBytes(d.transport?.bytes_received));
        updateStat(body, 'pub-pktloss', d.transport?.packets_lost != null ? d.transport.packets_lost.toLocaleString() : '-', d.transport?.packets_lost > 0 ? 'warn' : '');
        updateStat(body, 'pub-sendrate', d.transport?.estimated_send_rate_mbps != null ? d.transport.estimated_send_rate_mbps.toFixed(1) + ' Mbps' : '-');

        // Update expandable panel contents (without touching open/closed state)
        if (d.video_structure) {
          const vs = d.video_structure;
          const vsEl = body.querySelector('[data-panel="vs"]');
          if (vsEl) {
            const frameDur = vs.fps > 0 ? (1000 / vs.fps).toFixed(2) : '?';
            const framesPerFrag = vs.fps > 0 && vs.fragment_duration_ms > 0 ? Math.round(vs.fps * vs.fragment_duration_ms / 1000) : '?';
            vsEl.innerHTML =
              `<span style="color:#60a5fa;font-weight:600">Input Video Structure</span>\n\n` +
              `  FPS .................. <span style="color:#4ade80">${vs.fps}</span>\n` +
              `  Timescale ............ ${vs.timescale}${vs.default_sample_duration ? `  (sample_duration: ${vs.default_sample_duration})` : ''}\n` +
              `  Frame Duration ....... ${frameDur} ms\n\n` +
              `<span style="color:#60a5fa;font-weight:600">Segment (MoQT Group)</span>\n\n` +
              `  Duration ............. <span style="color:#4ade80">${(vs.segment_duration_ms / 1000).toFixed(3)}s</span>  (${vs.segment_duration_ms} ms)\n` +
              `  Fragments ............ <span style="color:#4ade80">${vs.fragments_per_segment}</span>\n\n` +
              `<span style="color:#60a5fa;font-weight:600">Fragment (MoQT Object)</span>\n\n` +
              `  Duration ............. <span style="color:#4ade80">${vs.fragment_duration_ms} ms</span>\n` +
              `  Frames / Fragment .... ~${framesPerFrag}\n\n` +
              `<span style="color:#737373">  [ ${vs.fps} fps ] → [ ${vs.fragments_per_segment} frags × ${vs.fragment_duration_ms} ms ] → [ segment ${vs.segment_duration_ms} ms ]</span>`;
          }
        }
        const catEl = body.querySelector('[data-panel="catalog"]');
        if (catEl && d.catalog) catEl.textContent = JSON.stringify(d.catalog, null, 2);
        const trEl = body.querySelector('[data-panel="transport"]');
        if (trEl && d.transport) trEl.textContent = JSON.stringify(d.transport, null, 2);

        const pubUp = body.querySelector('[data-role="pub-updated"]');
        if (pubUp && d.updated_at) {
          pubUp.textContent = 'Updated ' + ((Date.now() - d.updated_at) / 1000).toFixed(0) + 's ago';
        }
      }

      // Players — update in-place, add new player sections if needed
      if (entry.players) {
        for (const [pt, pd] of Object.entries(entry.players).sort()) {
          let section = body.querySelector(`[data-role="player-${pt}"]`);
          if (!section) {
            // New player type appeared, insert before warm section
            const warmEl = body.querySelector('[data-role="warm"]');
            const tmp = document.createElement('div');
            tmp.innerHTML = buildPlayerSection(pt, pd, ns);
            const newSection = tmp.firstElementChild;
            body.insertBefore(newSection, warmEl);
            section = newSection;
            continue; // just built it fresh, no need to update
          }

          const prefix = 'p-' + pt + '-';
          const typeName = pt.charAt(0).toUpperCase() + pt.slice(1);
          const viewerLabel = pd.viewer_count > 1 ? ` (${pd.viewer_count} viewers, avg)` : '';
          const plabel = section.querySelector(`[data-plabel="${pt}"]`);
          if (plabel) plabel.textContent = typeName + ' Player' + viewerLabel;

          updateStat(section, prefix + 'uptime', fmtUptime(pd.uptime_secs));
          updateStat(section, prefix + 'viewers', pd.viewer_count ?? '-', pd.viewer_count > 0 ? 'good' : '');
          updateStat(section, prefix + 'buffer', pd.buffer_health != null ? pd.buffer_health.toFixed(2) + 's' : '-');
          updateStat(section, prefix + 'latency', pd.latency != null ? pd.latency.toFixed(2) + 's' : '-');
          updateStat(section, prefix + 'resolution', (pd.width && pd.height) ? pd.width + 'x' + pd.height : '-');
          updateStat(section, prefix + 'bitrate', pd.bitrate_mbps != null ? pd.bitrate_mbps.toFixed(1) + ' Mbps' : '-');
          updateStat(section, prefix + 'estbw', (pd.estimated_bandwidth != null && pd.estimated_bandwidth > 0) ? pd.estimated_bandwidth.toFixed(1) + ' Mbps' : '-');
          updateStat(section, prefix + 'vcodec', pd.video_codec ?? '-');
          updateStat(section, prefix + 'acodec', pd.audio_codec ?? '-');
          updateStat(section, prefix + 'dropped', pd.dropped_frames ?? '-', pd.dropped_frames > 0 ? 'warn' : '');
          updateStat(section, prefix + 'loadtime', (pd.load_latency != null && pd.load_latency > 0) ? pd.load_latency.toFixed(2) + 's' : '-');
          updateStat(section, prefix + 'rebuffer', (pd.buffering_time != null && pd.buffering_time > 0) ? pd.buffering_time.toFixed(1) + 's' : '-', pd.buffering_time > 2 ? 'warn' : '');
          updateStat(section, prefix + 'playtime', (pd.play_time != null && pd.play_time > 0) ? fmtUptime(pd.play_time) : '-');
          updateStat(section, prefix + 'switches', (pd.switch_count != null && pd.switch_count > 0) ? pd.switch_count : '-');
          updateStat(section, prefix + 'framesrx', pd.frames_received != null ? pd.frames_received.toLocaleString() : '-');
          updateStat(section, prefix + 'bytesrx', pd.bytes_received != null ? fmtBytes(pd.bytes_received) : '-');
          const relayFull = pd.relay || '';
          const relayShort = relayFull.length > 15 ? relayFull.slice(0, 15) + '…' : relayFull;
          updateStat(section, prefix + 'relay', relayFull ? `<span title="${relayFull}">${relayShort}</span>` : '-');

          // Update shaka config content without touching open/closed
          const cfgEl = section.querySelector(`[data-panel="shaka-cfg-${pt}"]`);
          if (cfgEl && pd.shaka_config) cfgEl.textContent = JSON.stringify(pd.shaka_config, null, 2);

          const pUp = body.querySelector(`[data-role="${pt}-updated"]`);
          if (pUp && pd.updated_at) {
            pUp.textContent = 'Updated ' + ((Date.now() - pd.updated_at) / 1000).toFixed(0) + 's ago';
          }
        }

        // Remove player sections that no longer exist
        body.querySelectorAll('[data-role^="player-"]').forEach(el => {
          const pt = el.dataset.role.replace('player-', '');
          if (!entry.players[pt]) el.remove();
        });
      }

      // Warm status
      const warmEl = body.querySelector('[data-role="warm"]');
      if (warmEl) warmEl.innerHTML = renderWarmStatus(ns);
    }

    function render(msg) {
      data = msg.namespaces || {};
      const content = document.getElementById('content');
      const empty = document.getElementById('empty');
      const namespaces = Object.keys(data).sort();

      if (namespaces.length === 0) {
        empty.style.display = '';
        content.querySelectorAll('.ns-card').forEach(el => el.remove());
        return;
      }
      empty.style.display = 'none';

      for (const ns of namespaces) {
        const entry = data[ns];
        let card = content.querySelector(`.ns-card[data-ns="${ns}"]`);

        if (!card) {
          card = document.createElement('div');
          card.className = 'ns-card';
          card.dataset.ns = ns;
          card.innerHTML = `
            <div class="ns-header" onclick="toggle('${ns}')">
              <div style="display:flex;align-items:center;gap:12px">
                <span class="chevron" id="chev-${ns}">&#9654;</span>
                <span class="ns-name">${ns}</span>
              </div>
              <div class="ns-badges" id="badges-${ns}"></div>
            </div>
            <div class="ns-body" id="body-${ns}"></div>
          `;
          content.appendChild(card);
        }

        // Count warm nodes for this namespace
        const warmNodes = Object.values(pullerStatus).filter(p =>
          p.warm_namespaces?.includes(ns)
        );
        const activeNodes = Object.values(pullerStatus).filter(p =>
          p.active_namespaces?.includes(ns)
        );

        const hasPlayers = entry.players && Object.keys(entry.players).length > 0;
        const totalViewers = hasPlayers ? Object.values(entry.players).reduce((sum, p) => sum + (p.viewer_count || 0), 0) : 0;

        const badges = card.querySelector(`#badges-${ns}`);
        const pubBitrate = entry.publisher?.bitrate_mbps;
        const badgeHtml = `
          <span class="badge ${entry.publisher ? 'on' : 'off'}">PUB ${entry.publisher ? 'ON' : 'OFF'}</span>
          ${pubBitrate != null ? `<span class="badge on">${pubBitrate.toFixed(1)} Mbps</span>` : ''}
          <span class="badge ${hasPlayers ? 'on' : 'off'}">${totalViewers} VIEWER${totalViewers !== 1 ? 'S' : ''}</span>
          ${activeNodes.length > 0 ? `<span class="badge ${warmNodes.length === activeNodes.length ? 'on' : 'off'}">${warmNodes.length}/${activeNodes.length} WARM</span>` : ''}
        `;
        if (badges.innerHTML !== badgeHtml) badges.innerHTML = badgeHtml;

        const body = card.querySelector(`#body-${ns}`);
        if (body.classList.contains('open')) {
          if (body.children.length === 0) {
            // First render — build full DOM
            body.innerHTML = buildNsBody(ns, entry);
          }
          // Patch values in-place
          updateNsBody(ns, entry, body);
        }
      }

      content.querySelectorAll('.ns-card').forEach(el => {
        if (!data[el.dataset.ns]) el.remove();
      });
    }

    function toggle(ns) {
      const body = document.getElementById('body-' + ns);
      const chev = document.getElementById('chev-' + ns);
      const isOpen = body.classList.toggle('open');
      chev.classList.toggle('open', isOpen);

      if (isOpen && data[ns]) {
        body.innerHTML = buildNsBody(ns, data[ns]);
        updateNsBody(ns, data[ns], body);
      }
    }

    function renderWarmStatus(ns) {
      const nodes = Object.entries(pullerStatus);
      const relevant = nodes.filter(([_, p]) =>
        p.active_namespaces?.includes(ns) || p.warm_namespaces?.includes(ns)
      );
      if (relevant.length === 0) return '';
      let html = '<div class="warm-section"><div class="role-label">Edge Warm Status</div><div class="warm-grid">';
      for (const [node, p] of relevant) {
        const warm = p.warm_namespaces?.includes(ns);
        html += `<span class="warm-chip ${warm ? 'warm' : 'pending'}">${node} (${p.region || '?'}) ${warm ? 'WARM' : '...'}</span>`;
      }
      html += '</div></div>';
      return html;
    }

    function connectPullerWs() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      pullerWs = new WebSocket(proto + '//' + location.host + '/api/pullers/status/ws');
      pullerWs.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'status') {
          pullerStatus = msg.pullers || {};
          // Re-render open cards
          if (Object.keys(data).length > 0) {
            render({ namespaces: data });
          }
        }
      };
      pullerWs.onclose = () => setTimeout(connectPullerWs, 3000);
      pullerWs.onerror = () => pullerWs.close();
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host + '/api/stats/ws');

      ws.onopen = () => {
        document.getElementById('ws-dot').className = 'status-dot on';
      };
      ws.onmessage = (e) => {
        render(JSON.parse(e.data));
      };
      ws.onclose = () => {
        document.getElementById('ws-dot').className = 'status-dot off';
        setTimeout(connect, 2000);
      };
      ws.onerror = () => { ws.close(); };
    }

    fetch('/api/auth/me').then(r => r.json()).then(d => {
      if (!d.authenticated) {
        document.getElementById('content').innerHTML =
          '<div class="empty">Not authenticated. <a href="/admin" style="color:#667eea">Sign in</a></div>';
        return;
      }
      connect();
      connectPullerWs();
    });
  </script>
</body>
</html>
