<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>MoQpush stats</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0a; color: #e5e5e5; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #1a1a1a; }
    .header h1 { font-size: 1.2em; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }
    .header h1 .logo-icon { width: 28px; height: 28px; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5)); }
    .header h1 .logo-text { background: linear-gradient(135deg, #60a5fa 0%, #34d399 50%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header a { color: #737373; text-decoration: none; font-size: 0.9em; }
    .header a:hover { color: #e5e5e5; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
    .status-dot.on { background: #4ade80; }
    .status-dot.off { background: #ef4444; }
    .content { max-width: 1000px; margin: 0 auto; padding: 24px; }
    .empty { text-align: center; color: #525252; padding: 60px 0; }

    .ns-card { border: 1px solid #1a1a1a; border-radius: 8px; margin-bottom: 12px; overflow: hidden; }
    .ns-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: pointer; background: #111; }
    .ns-header:hover { background: #171717; }
    .ns-name { font-family: monospace; font-weight: 600; font-size: 1em; }
    .ns-badges { display: flex; gap: 8px; }
    .badge { font-size: 0.7em; padding: 2px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .badge.on { background: #166534; color: #4ade80; }
    .badge.off { background: #1c1917; color: #525252; }
    .chevron { color: #525252; transition: transform 0.2s; font-size: 0.9em; }
    .chevron.open { transform: rotate(90deg); }

    .ns-body { display: none; padding: 16px; border-top: 1px solid #1a1a1a; }
    .ns-body.open { display: block; }

    .role-section { margin-bottom: 16px; }
    .role-label { font-size: 0.75em; text-transform: uppercase; letter-spacing: 0.1em; color: #737373; margin-bottom: 8px; font-weight: 600; }

    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .stat { background: #171717; border-radius: 6px; padding: 8px 10px; }
    .stat-label { font-size: 0.65em; text-transform: uppercase; letter-spacing: 0.05em; color: #737373; margin-bottom: 2px; }
    .stat-value { font-family: monospace; font-size: 0.95em; }
    .stat-value.warn { color: #fbbf24; }
    .stat-value.err { color: #f87171; }
    .stat-value.good { color: #4ade80; }

    .updated { font-size: 0.7em; color: #525252; margin-top: 6px; text-align: right; }
    .warm-section { margin-top: 12px; }
    .warm-grid { display: flex; gap: 6px; flex-wrap: wrap; }
    .warm-chip { font-size: 0.7em; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
    .warm-chip.warm { background: #1e3a5f; color: #60a5fa; }
    .warm-chip.pending { background: #3b2f1a; color: #fbbf24; }
    .warm-chip.cold { background: #1c1917; color: #525252; }
    .catalog-toggle { font-size: 0.75em; color: #737373; cursor: pointer; margin-top: 8px; user-select: none; }
    .catalog-toggle:hover { color: #e5e5e5; }
    .catalog-pre { background: #0d0d0d; border: 1px solid #1a1a1a; border-radius: 6px; padding: 12px; margin-top: 6px; font-family: monospace; font-size: 0.75em; color: #a3a3a3; overflow-x: auto; white-space: pre; display: none; }
    .catalog-pre.open { display: block; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>
        <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="48" fill="url(#oG)"/><path d="M30 25c5-3 15-5 20 0s10 10 5 18c-3 5-10 8-15 5s-12-8-15-13c-2-4 0-8 5-10z" fill="url(#lG)" opacity="0.9"/><path d="M55 30c8-2 18 2 22 10s2 20-8 25c-8 4-15 0-18-8s-4-15 0-20c2-4 6-6 4-7z" fill="url(#lG)" opacity="0.9"/><path d="M25 50c3-2 10-1 15 3s8 12 5 18c-2 5-8 8-14 6s-10-8-10-15c0-5 2-10 4-12z" fill="url(#lG)" opacity="0.9"/><path d="M60 60c5-1 12 2 15 8s2 14-5 18c-5 3-12 1-15-5s-3-12 0-16c2-3 3-4 5-5z" fill="url(#lG)" opacity="0.9"/><circle cx="50" cy="50" r="48" fill="none" stroke="url(#aG)" stroke-width="3" opacity="0.6"/><ellipse cx="35" cy="30" rx="12" ry="8" fill="white" opacity="0.15" transform="rotate(-30 35 30)"/><defs><linearGradient id="oG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e40af"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient><linearGradient id="lG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient><linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs></svg>
        <span class="status-dot off" id="ws-dot"></span>
        <span class="logo-text">MoQpush</span> stats
      </h1>
    </div>
    <div>
      <a href="/admin">Admin</a>
    </div>
  </div>

  <div class="content" id="content">
    <div class="empty" id="empty">No active streams</div>
  </div>

  <script>
    let ws = null;
    let pullerWs = null;
    let data = {};
    let pullerStatus = {};

    function fmtBytes(b) {
      if (b == null) return '-';
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
      if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
      return (b / 1073741824).toFixed(2) + ' GB';
    }

    function fmtUptime(s) {
      if (s == null) return '-';
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = Math.floor(s % 60);
      return `${h}h ${m}m ${sec}s`;
    }

    function stat(label, value, cls) {
      return `<div class="stat"><div class="stat-label">${label}</div><div class="stat-value ${cls || ''}">${value ?? '-'}</div></div>`;
    }

    function renderRole(label, d) {
      if (!d) return '';
      let html = `<div class="role-section"><div class="role-label">${label}</div><div class="stat-grid">`;

      html += stat('Uptime', fmtUptime(d.uptime_secs));

      // Publisher stats
      if (d.tracks != null) html += stat('Tracks', d.tracks);
      if (d.bytes_published != null) html += stat('Published', fmtBytes(d.bytes_published));
      if (d.frames_sent != null) html += stat('Frames', d.frames_sent.toLocaleString());
      if (d.segments_sent != null) html += stat('Segments', d.segments_sent.toLocaleString());
      if (d.video_width && d.video_height) html += stat('Resolution', d.video_width + 'x' + d.video_height);
      if (d.video_codec != null && d.role === 'publisher') html += stat('Video Codec', d.video_codec);
      if (d.audio_codec != null && d.role === 'publisher') html += stat('Audio Codec', d.audio_codec);

      // Transport stats (QUIC/WebTransport)
      if (d.transport) {
        const t = d.transport;
        if (t.rtt_ms != null) html += stat('RTT', t.rtt_ms.toFixed(1) + ' ms', t.rtt_ms > 100 ? 'warn' : 'good');
        if (t.bytes_sent != null) html += stat('TX', fmtBytes(t.bytes_sent));
        if (t.bytes_received != null) html += stat('RX', fmtBytes(t.bytes_received));
        if (t.packets_lost != null) html += stat('Pkt Loss', t.packets_lost.toLocaleString(), t.packets_lost > 0 ? 'warn' : '');
        if (t.bytes_lost != null && t.bytes_lost > 0) html += stat('Bytes Lost', fmtBytes(t.bytes_lost), 'warn');
        if (t.packets_sent != null) html += stat('Pkts Sent', t.packets_sent.toLocaleString());
        if (t.estimated_send_rate_mbps != null) html += stat('Send Rate', t.estimated_send_rate_mbps.toFixed(1) + ' Mbps');
      }

      // Player stats
      if (d.buffer_health != null) html += stat('Buffer', d.buffer_health.toFixed(2) + 's');
      if (d.latency != null) html += stat('Latency', d.latency.toFixed(2) + 's');
      if (d.width != null && d.height != null && d.role !== 'publisher') html += stat('Resolution', d.width + 'x' + d.height);
      if (d.bitrate_mbps != null) html += stat('Bitrate', d.bitrate_mbps.toFixed(1) + ' Mbps');
      if (d.estimated_bandwidth != null && d.estimated_bandwidth > 0) html += stat('Est. BW', d.estimated_bandwidth.toFixed(1) + ' Mbps');
      if (d.video_codec != null && d.role !== 'publisher') html += stat('Video Codec', d.video_codec);
      if (d.audio_codec != null && d.role !== 'publisher') html += stat('Audio Codec', d.audio_codec);
      if (d.dropped_frames != null) html += stat('Dropped', d.dropped_frames, d.dropped_frames > 0 ? 'warn' : '');
      if (d.load_latency != null && d.load_latency > 0) html += stat('Load Time', d.load_latency.toFixed(2) + 's');
      if (d.buffering_time != null && d.buffering_time > 0) html += stat('Rebuffer', d.buffering_time.toFixed(1) + 's', d.buffering_time > 2 ? 'warn' : '');
      if (d.play_time != null && d.play_time > 0) html += stat('Play Time', fmtUptime(d.play_time));
      if (d.switch_count != null && d.switch_count > 0) html += stat('Switches', d.switch_count);
      if (d.relay != null) {
        const full = d.relay;
        const short = full.length > 15 ? full.slice(0, 15) + '…' : full;
        html += stat('Relay', `<span title="${full}">${short}</span>`);
      }

      html += '</div>';

      // Show Shaka player config (preserved open state across updates)
      if (d.shaka_config) {
        const cfgId = 'cfg-' + (d.namespace || label).replace(/\W/g, '');
        const wasOpen = document.getElementById(cfgId)?.classList.contains('open');
        html += `<div class="catalog-toggle" onclick="document.getElementById('${cfgId}').classList.toggle('open')">Shaka Config</div>`;
        html += `<pre class="catalog-pre ${wasOpen ? 'open' : ''}" id="${cfgId}">${JSON.stringify(d.shaka_config, null, 2)}</pre>`;
      }

      // Show catalog JSON for publisher (preserved open state across updates)
      if (d.catalog) {
        const catId = 'cat-' + (d.namespace || label).replace(/\W/g, '');
        const wasOpen = document.getElementById(catId)?.classList.contains('open');
        html += `<div class="catalog-toggle" onclick="document.getElementById('${catId}').classList.toggle('open')">MSF Catalog</div>`;
        html += `<pre class="catalog-pre ${wasOpen ? 'open' : ''}" id="${catId}">${JSON.stringify(d.catalog, null, 2)}</pre>`;
      }

      // Show transport stats JSON (preserved open state across updates)
      if (d.transport) {
        const trId = 'tr-' + (d.namespace || label).replace(/\W/g, '');
        const wasOpen = document.getElementById(trId)?.classList.contains('open');
        html += `<div class="catalog-toggle" onclick="document.getElementById('${trId}').classList.toggle('open')">Transport (QUIC)</div>`;
        html += `<pre class="catalog-pre ${wasOpen ? 'open' : ''}" id="${trId}">${JSON.stringify(d.transport, null, 2)}</pre>`;
      }

      if (d.updated_at) {
        const ago = ((Date.now() - d.updated_at) / 1000).toFixed(0);
        html += `<div class="updated">Updated ${ago}s ago</div>`;
      }
      html += '</div>';
      return html;
    }

    function render(msg) {
      data = msg.namespaces || {};
      const content = document.getElementById('content');
      const empty = document.getElementById('empty');
      const namespaces = Object.keys(data).sort();

      if (namespaces.length === 0) {
        empty.style.display = '';
        content.querySelectorAll('.ns-card').forEach(el => el.remove());
        return;
      }
      empty.style.display = 'none';

      const existing = new Set();
      content.querySelectorAll('.ns-card').forEach(el => existing.add(el.dataset.ns));

      for (const ns of namespaces) {
        const entry = data[ns];
        let card = content.querySelector(`.ns-card[data-ns="${ns}"]`);

        if (!card) {
          card = document.createElement('div');
          card.className = 'ns-card';
          card.dataset.ns = ns;
          card.innerHTML = `
            <div class="ns-header" onclick="toggle('${ns}')">
              <div style="display:flex;align-items:center;gap:12px">
                <span class="chevron" id="chev-${ns}">&#9654;</span>
                <span class="ns-name">${ns}</span>
              </div>
              <div class="ns-badges" id="badges-${ns}"></div>
            </div>
            <div class="ns-body" id="body-${ns}"></div>
          `;
          content.appendChild(card);
        }

        // Count warm nodes for this namespace
        const warmNodes = Object.values(pullerStatus).filter(p =>
          p.warm_namespaces?.includes(ns)
        );
        const activeNodes = Object.values(pullerStatus).filter(p =>
          p.active_namespaces?.includes(ns)
        );

        const badges = card.querySelector(`#badges-${ns}`);
        badges.innerHTML = `
          <span class="badge ${entry.publisher ? 'on' : 'off'}">PUB ${entry.publisher ? 'ON' : 'OFF'}</span>
          <span class="badge ${entry.player ? 'on' : 'off'}">PLAY ${entry.player ? 'ON' : 'OFF'}</span>
          ${activeNodes.length > 0 ? `<span class="badge ${warmNodes.length === activeNodes.length ? 'on' : 'off'}">${warmNodes.length}/${activeNodes.length} WARM</span>` : ''}
        `;

        const body = card.querySelector(`#body-${ns}`);
        if (body.classList.contains('open')) {
          body.innerHTML =
            renderRole('Publisher', entry.publisher) +
            renderRole('Player', entry.player) +
            renderWarmStatus(ns);
        }
      }

      content.querySelectorAll('.ns-card').forEach(el => {
        if (!data[el.dataset.ns]) el.remove();
      });
    }

    function toggle(ns) {
      const body = document.getElementById('body-' + ns);
      const chev = document.getElementById('chev-' + ns);
      const isOpen = body.classList.toggle('open');
      chev.classList.toggle('open', isOpen);

      if (isOpen && data[ns]) {
        body.innerHTML =
          renderRole('Publisher', data[ns].publisher) +
          renderRole('Player', data[ns].player) +
          renderWarmStatus(ns);
      }
    }

    function renderWarmStatus(ns) {
      const nodes = Object.entries(pullerStatus);
      const relevant = nodes.filter(([_, p]) =>
        p.active_namespaces?.includes(ns) || p.warm_namespaces?.includes(ns)
      );
      if (relevant.length === 0) return '';
      let html = '<div class="warm-section"><div class="role-label">Edge Warm Status</div><div class="warm-grid">';
      for (const [node, p] of relevant) {
        const warm = p.warm_namespaces?.includes(ns);
        html += `<span class="warm-chip ${warm ? 'warm' : 'pending'}">${node} (${p.region || '?'}) ${warm ? 'WARM' : '...'}</span>`;
      }
      html += '</div></div>';
      return html;
    }

    function connectPullerWs() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      pullerWs = new WebSocket(proto + '//' + location.host + '/api/pullers/status/ws');
      pullerWs.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'status') {
          pullerStatus = msg.pullers || {};
          // Re-render open cards
          if (Object.keys(data).length > 0) {
            render({ namespaces: data });
          }
        }
      };
      pullerWs.onclose = () => setTimeout(connectPullerWs, 3000);
      pullerWs.onerror = () => pullerWs.close();
    }

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host + '/api/stats/ws');

      ws.onopen = () => {
        document.getElementById('ws-dot').className = 'status-dot on';
      };
      ws.onmessage = (e) => {
        render(JSON.parse(e.data));
      };
      ws.onclose = () => {
        document.getElementById('ws-dot').className = 'status-dot off';
        setTimeout(connect, 2000);
      };
      ws.onerror = () => { ws.close(); };
    }

    fetch('/api/auth/me').then(r => r.json()).then(d => {
      if (!d.authenticated) {
        document.getElementById('content').innerHTML =
          '<div class="empty">Not authenticated. <a href="/admin" style="color:#667eea">Sign in</a></div>';
        return;
      }
      connect();
      connectPullerWs();
    });
  </script>
</body>
</html>
