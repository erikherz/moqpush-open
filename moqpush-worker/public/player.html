<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>MoQpush player</title>
  <link rel="stylesheet" href="https://shaka-project.github.io/shaka-player/dist/controls.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .player-container { width: 100%; max-width: 1280px; position: relative; }
    .shaka-video-container { width: 100%; background: #111; }
    .shaka-video-container video { width: 100%; }
    .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); z-index: 10; }
    .overlay.hidden { display: none; }
    .status { text-align: center; }
    .status h2 { margin-bottom: 8px; }
    .status p { color: #888; font-size: 0.9em; }
    .stats { position: absolute; top: 40px; left: 10px; background: rgba(0,0,0,0.88); padding: 14px 18px; border-radius: 4px; font-family: 'Roboto Mono', 'SF Mono', monospace; font-size: 12px; line-height: 2; display: none; z-index: 15; color: #fff; min-width: 380px; border: 1px solid rgba(255,255,255,0.1); pointer-events: none; }
    .stats.visible { display: block; }
    .stats-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.2); }
    .stats-row { display: flex; justify-content: space-between; }
    .stats-label { color: #aaa; }
    .stats-val { color: #fff; }
    .error { color: #e74c3c; }
    .namespace-label { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 4px; font-size: 0.85em; z-index: 5; }
    .player-mode { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 4px; font-size: 0.75em; z-index: 6; margin-top: 28px; color: #7ee787; }
    .console-toggle { width: 100%; background: #111; border: none; color: #666; font-size: 12px; padding: 6px 0; cursor: pointer; font-family: -apple-system, BlinkMacSystemFont, sans-serif; border-top: 1px solid #222; }
    .console-toggle:hover { color: #aaa; background: #1a1a1a; }
    .console-toggle .arrow { display: inline-block; transition: transform 0.2s; margin-right: 6px; }
    .console-toggle.open .arrow { transform: rotate(180deg); }
    .console-panel { background: #0d1117; border-top: 1px solid #222; max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
    .console-panel.open { max-height: 500px; overflow-y: auto; }
    .console-panel pre { margin: 0; padding: 12px 16px; font-family: 'Roboto Mono', 'SF Mono', monospace; font-size: 11px; line-height: 1.5; color: #e6edf3; white-space: pre-wrap; word-break: break-all; }
    .console-panel .console-label { color: #7ee787; font-weight: 600; display: block; margin-bottom: 4px; }
    .password-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .password-overlay.hidden { display: none; }
    .password-box { text-align: center; max-width: 360px; }
    .password-box h2 { margin-bottom: 8px; font-size: 1.1em; }
    .password-box p { color: #888; font-size: 0.85em; margin-bottom: 16px; }
    .password-box input { background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 10px 14px; border-radius: 6px; font-size: 1em; width: 100%; margin-bottom: 10px; text-align: center; }
    .password-box input:focus { outline: none; border-color: #667eea; }
    .password-box button { background: #667eea; color: #fff; border: none; padding: 10px 24px; border-radius: 6px; font-size: 0.9em; cursor: pointer; }
    .password-box button:hover { background: #5a6fd6; }
    .password-box .pw-error { color: #e74c3c; font-size: 0.85em; margin-top: 8px; display: none; }
  </style>
</head>
<body>
  <div class="player-container">
    <div class="namespace-label" id="ns-label"></div>
    <div class="player-mode" id="player-mode"></div>
    <div id="video-container" class="shaka-video-container">
      <video id="video" autoplay muted playsinline controls></video>
    </div>

    <div class="overlay" id="overlay">
      <div class="status">
        <h2 id="status-title">Connecting...</h2>
        <p id="status-detail">Looking up broadcast</p>
      </div>
    </div>

    <div class="stats" id="stats"></div>
    <button class="console-toggle" id="console-toggle" onclick="toggleConsole()">
      <span class="arrow">&#9660;</span> MSF Catalog
    </button>
    <div class="console-panel" id="console-panel">
      <pre id="console-content"><span class="console-label">Waiting for catalog...</span></pre>
    </div>
  </div>

  <div class="password-overlay hidden" id="password-overlay">
    <div class="password-box">
      <h2>This stream is password-protected</h2>
      <p id="pw-namespace"></p>
      <input type="password" id="pw-input" placeholder="Enter password" autocomplete="off">
      <button onclick="submitPassword()">Watch</button>
      <div class="pw-error" id="pw-error">Incorrect password</div>
    </div>
  </div>

  <!-- Shaka Player (loaded for default mode) -->
  <script src="https://shaka-project.github.io/shaka-player/dist/shaka-player.experimental.debug.js"></script>
  <!-- Custom player scripts (loaded for ?custom-player=true) -->
  <script src="/js/fragment-appender.min.js?v=16"></script>
  <script src="/js/moqt-player.min.js?v=16"></script>

  <script>
    const namespace = window.location.pathname.replace(/^\//, '').replace(/\/$/, '');
    document.getElementById('ns-label').textContent = namespace;
    document.title = `${namespace} - moqpush`;

    const video = document.getElementById('video');
    const videoContainer = document.getElementById('video-container');
    const overlay = document.getElementById('overlay');
    const statusTitle = document.getElementById('status-title');
    const statusDetail = document.getElementById('status-detail');
    const statsEl = document.getElementById('stats');
    const urlParams = new URLSearchParams(window.location.search);

    // Toggle stats with 'I' key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'i' || e.key === 'I') {
        statsEl.classList.toggle('visible');
      }
    });

    let currentPlayer = null;
    let relayUrl = null;
    let statsInterval = null;
    let bufferInterval = null;
    let playerStatsInterval = null;
    let startTime = Date.now();
    const sessionId = crypto.randomUUID();

    // ?player=shaka -> Shaka, anything else (default / ?player=viper) -> Viper custom player
    const playerParam = urlParams.get('player');
    const useShaka = playerParam === 'shaka';
    document.getElementById('player-mode').textContent = useShaka ? 'Shaka Player' : 'Viper Player (MoQT + MSE)';

    // --- Password check, then route to correct player ---
    let passwordCallback = null;

    function submitPassword() {
      const pw = document.getElementById('pw-input').value;
      if (passwordCallback) passwordCallback(pw);
    }
    document.getElementById('pw-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitPassword();
    });

    async function checkPassword() {
      statusTitle.textContent = 'Looking up broadcast...';
      const dirResp = await fetch(`/api/broadcasts/${namespace}`);
      if (!dirResp.ok) {
        statusTitle.textContent = 'Broadcast not found';
        statusDetail.textContent = 'This namespace is not currently live';
        statusTitle.classList.add('error');
        return null;
      }
      const dirData = await dirResp.json();

      if (dirData.has_password) {
        // Show password prompt
        overlay.classList.add('hidden');
        document.getElementById('pw-namespace').textContent = namespace;
        document.getElementById('password-overlay').classList.remove('hidden');
        document.getElementById('pw-input').focus();

        // Wait for user to submit password
        const authenticated = await new Promise((resolve) => {
          passwordCallback = async (pw) => {
            const authResp = await fetch(`/api/broadcasts/${namespace}/auth`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ password: pw }),
            });
            if (authResp.ok) {
              document.getElementById('password-overlay').classList.add('hidden');
              overlay.classList.remove('hidden');
              resolve(true);
            } else {
              document.getElementById('pw-error').style.display = 'block';
              document.getElementById('pw-input').value = '';
              document.getElementById('pw-input').focus();
            }
          };
        });
        if (!authenticated) return null;
      }

      return dirData;
    }

    (async () => {
      const dirData = await checkPassword();
      if (!dirData) return;
      if (useShaka) {
        loadShakaPlayer(dirData);
      } else {
        loadCustomPlayer(dirData);
      }
    })();

    // --- Custom MoQT Player (direct MSE injection, sub-second latency) ---

    async function loadCustomPlayer(dirData) {
      try {
        relayUrl = dirData.relay_url;

        // Override relay from query param
        const relayOverride = urlParams.get('relay');
        if (relayOverride) {
          relayUrl = relayOverride.startsWith('https://') ? relayOverride : `https://${relayOverride}`;
        }

        if (!window.WebTransport) {
          statusTitle.textContent = 'Browser not supported';
          statusDetail.textContent = 'WebTransport API required for custom player';
          statusTitle.classList.add('error');
          return;
        }

        statusDetail.textContent = `${relayUrl} / ${namespace}`;

        // Clean relay URL (add trailing slash)
        const connectUrl = `${relayUrl.replace(/\/+$/, '')}/`;
        let catalogJson = null;

        const startFilter = urlParams.get('start') || 'latest_group';
        const batchSize = parseInt(urlParams.get('batch')) || 1;
        const player = new window.MoqtPlayer(video, connectUrl, namespace, {
          startFilter,
          batchSize,
          onStatus: (msg) => {
            statusTitle.textContent = msg;
            if (msg === 'Playing') {
              overlay.classList.add('hidden');
              startTime = Date.now();
            }
          },
          onCatalog: (catalog) => {
            catalogJson = catalog;
            const content = document.getElementById('console-content');
            // Strip initData for display
            const displayCatalog = JSON.parse(JSON.stringify(catalog));
            if (displayCatalog.tracks) {
              for (const t of displayCatalog.tracks) { delete t.initData; }
            }
            content.innerHTML = `<span class="console-label">MSF Catalog (${(catalog.tracks || []).length} tracks) [Custom Player]</span>${escapeHtml(JSON.stringify(displayCatalog, null, 2))}`;
          },
        });

        currentPlayer = player;
        await player.connect();

        // Stats overlay update loop
        statsInterval = setInterval(() => {
          if (!statsEl.classList.contains('visible')) return;
          const s = player.getStats();
          const uptime = ((Date.now() - startTime) / 1000).toFixed(0);
          const row = (label, val) => `<div class="stats-row"><span class="stats-label">${label}</span><span class="stats-val">${val}</span></div>`;

          const t = player.getTiming();
          const tRow = (label, ms) => ms != null ? row(label, `${ms}ms`) : '';
          statsEl.innerHTML = `
            <div class="stats-title">Viper Player</div>
            ${row('Protocol', 'MoQ Transport / WebTransport')}
            ${row('Catalog', 'MSF draft-00 / CMSF draft-00')}
            ${row('Relay', relayUrl.replace('https://', ''))}
            ${row('Namespace', namespace)}
            ${row('', '')}
            ${row('Video', `${s.width}x${s.height}`)}
            ${row('Video Codec', player.appender.codecs.video || 'pending')}
            ${row('Audio Codec', player.appender.codecs.audio || 'pending')}
            ${row('Dropped Frames', `${(video.getVideoPlaybackQuality?.() || {}).droppedVideoFrames || 0}`)}
            ${row('Frames Received', s.framesReceived)}
            ${row('Buffer Health', `${s.bufferHealth}s`)}
            ${row('Session', `${uptime}s`)}
            ${row('', '')}
            ${tRow('SETUP', t.setupMs)}
            ${tRow('Catalog', t.catalogMs)}
            ${tRow('1st Fragment', t.firstFragmentMs)}
            ${row('', '')}
            ${row('Player', 'Viper (MoQT + MSE)')}
            ${tRow('TTFF', t.firstDecodedMs)}
          `;
        }, 500);

        // Push player stats to worker every 1s
        playerStatsInterval = setInterval(() => {
          const s = player.getStats();
          fetch('/api/player-stats', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              namespace,
              player_type: 'viper',
              session_id: sessionId,
              buffer_health: parseFloat(s.bufferHealth),
              width: s.width || 0,
              height: s.height || 0,
              dropped_frames: 0,
              relay: relayUrl.replace('https://', ''),
              uptime_secs: s.uptime,
              custom_player: true,
              frames_received: s.framesReceived,
              bytes_received: s.bytesReceived,
            }),
          }).catch(() => {});
        }, 1000);

      } catch (err) {
        console.error('Custom player error:', err);
        statusTitle.textContent = 'Connection failed';
        statusDetail.textContent = err.message || String(err);
        statusTitle.classList.add('error');
      }
    }

    // --- Shaka Player (buffered playback) ---

    async function loadShakaPlayer(dirData) {
      try {
        relayUrl = dirData.relay_url;

        if (typeof shaka === 'undefined') {
          statusTitle.textContent = 'Player not loaded';
          statusDetail.textContent = 'Shaka Player JS not found';
          statusTitle.classList.add('error');
          return;
        }

        shaka.polyfill.installAll();
        if (!shaka.Player.isBrowserSupported()) {
          statusTitle.textContent = 'Browser not supported';
          statusDetail.textContent = 'WebTransport + MSE required';
          statusTitle.classList.add('error');
          return;
        }

        // Override relay from query param
        const relayOverride = urlParams.get('relay');
        if (relayOverride) {
          relayUrl = relayOverride.startsWith('https://') ? relayOverride : `https://${relayOverride}`;
        }

        statusTitle.textContent = 'Loading stream...';
        statusDetail.textContent = `${relayUrl} / ${namespace}`;

        const player = new shaka.Player();
        await player.attach(video);
        currentPlayer = player;

        const bufferingGoal = parseFloat(urlParams.get('bufferingGoal')) || 0.5;
        const rebufferingGoal = parseFloat(urlParams.get('rebufferingGoal')) || 0.2;
        const bufferBehind = parseFloat(urlParams.get('bufferBehind')) || 5;
        const lowLatencyMode = urlParams.get('lowLatencyMode') !== 'false';

        player.configure({
          streaming: {
            lowLatencyMode,
            bufferingGoal,
            rebufferingGoal,
            bufferBehind,
          },
          manifest: {
            msf: {
              namespaces: [namespace],
            },
          },
        });

        player.addEventListener('error', (event) => {
          console.error('Player error:', event.detail);
          statusTitle.textContent = 'Playback error';
          statusDetail.textContent = event.detail?.message || 'Unknown error';
          statusTitle.classList.add('error');
          overlay.classList.remove('hidden');
        });

        // Connect to Cloudflare relay
        const connectUrl = `${relayUrl.replace(/\/+$/, '')}/`;
        let shakaTtff = null;
        const ttffStart = Date.now();
        video.addEventListener('loadeddata', () => {
          if (shakaTtff === null) shakaTtff = Date.now() - ttffStart;
        }, { once: true });
        await player.load(connectUrl, undefined, 'application/msf');
        overlay.classList.add('hidden');
        startTime = Date.now();

        // MSE buffer diagnostics
        bufferInterval = setInterval(() => {
          const b = video.buffered;
          const ranges = [];
          for (let i = 0; i < b.length; i++) ranges.push(`${b.start(i).toFixed(2)}-${b.end(i).toFixed(2)}`);
          console.log(`[MSE] t=${video.currentTime.toFixed(2)} ready=${video.readyState} ranges=[${ranges.join(',')}]`);
        }, 2000);

        // Push player stats to worker every 1s
        playerStatsInterval = setInterval(() => {
          const stats = player.getStats();
          const buffered = video.buffered;
          const bufferEnd = buffered.length > 0 ? buffered.end(buffered.length - 1) : 0;
          const bufferHealth = bufferEnd - video.currentTime;
          const tracks = player.getVariantTracks();
          const activeVideo = tracks.find(t => t.active && t.videoCodec);
          const activeAudio = tracks.find(t => t.active && t.audioCodec);

          fetch('/api/player-stats', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              namespace,
              player_type: 'shaka',
              session_id: sessionId,
              buffer_health: parseFloat(bufferHealth.toFixed(2)),
              latency: parseFloat((stats.liveLatency || 0).toFixed(2)),
              width: stats.width || 0,
              height: stats.height || 0,
              bitrate_mbps: stats.streamBandwidth ? parseFloat((stats.streamBandwidth / 1e6).toFixed(2)) : 0,
              dropped_frames: stats.droppedFrames || 0,
              video_codec: activeVideo?.videoCodec || null,
              audio_codec: activeAudio?.audioCodec || null,
              relay: relayUrl.replace('https://', ''),
              uptime_secs: Math.floor((Date.now() - startTime) / 1000),
              estimated_bandwidth: stats.estimatedBandwidth ? parseFloat((stats.estimatedBandwidth / 1e6).toFixed(2)) : 0,
              load_latency: parseFloat((stats.loadLatency || 0).toFixed(3)),
              buffering_time: parseFloat((stats.bufferingTime || 0).toFixed(2)),
              play_time: parseFloat((stats.playTime || 0).toFixed(1)),
              state_changes: stats.stateHistory?.length || 0,
              switch_count: stats.switchHistory?.length || 0,
              shaka_config: {
                lowLatencyMode,
                bufferingGoal,
                rebufferingGoal,
                bufferBehind,
              },
            }),
          }).catch(() => {});
        }, 1000);

        // Stats overlay update loop
        statsInterval = setInterval(() => {
          if (document.getElementById('console-panel').classList.contains('open')) {
            updateCatalog(player);
          }
          if (!statsEl.classList.contains('visible')) return;
          const stats = player.getStats();
          const buffered = video.buffered;
          const bufferEnd = buffered.length > 0 ? buffered.end(buffered.length - 1) : 0;
          const bufferHealth = (bufferEnd - video.currentTime).toFixed(2);
          const uptime = ((Date.now() - startTime) / 1000).toFixed(0);
          const tracks = player.getVariantTracks();
          const activeVideo = tracks.find(t => t.active && t.videoCodec);
          const activeAudio = tracks.find(t => t.active && t.audioCodec);

          const row = (label, val) => `<div class="stats-row"><span class="stats-label">${label}</span><span class="stats-val">${val}</span></div>`;

          statsEl.innerHTML = `
            <div class="stats-title">Streaming Statistics</div>
            ${row('Protocol', 'MoQ Transport draft-14 / WebTransport')}
            ${row('Catalog', 'MSF draft-00 / CMSF draft-00')}
            ${row('Relay', relayUrl.replace('https://', ''))}
            ${row('Namespace', namespace)}
            ${row('', '')}
            ${row('Video', `${stats.width}x${stats.height}${stats.streamBandwidth ? ` @ ${(stats.streamBandwidth / 1e6).toFixed(1)} Mbps` : ''}`)}
            ${row('Video Codec', activeVideo?.videoCodec || 'pending')}
            ${row('Audio Codec', activeAudio?.audioCodec || 'pending')}
            ${row('Dropped Frames', `${stats.droppedFrames}`)}
            ${row('Frames Decoded', `${stats.decodedFrames}`)}
            ${row('', '')}
            ${row('Buffer Health', `${bufferHealth}s`)}
            ${row('Latency', `${(stats.liveLatency || 0).toFixed(2)}s`)}
            ${row('Session', `${uptime}s`)}
            ${row('Player', `Shaka ${shaka.Player.version || 'unknown'}`)}
            ${row('', '')}
            ${row('TTFF', shakaTtff !== null ? `${shakaTtff}ms` : 'pending')}
          `;
        }, 500);

      } catch (err) {
        console.error('Startup error:', err);
        statusTitle.textContent = 'Connection failed';
        statusDetail.textContent = err.message || String(err);
        statusTitle.classList.add('error');
      }
    }

    function toggleConsole() {
      const btn = document.getElementById('console-toggle');
      const panel = document.getElementById('console-panel');
      btn.classList.toggle('open');
      panel.classList.toggle('open');
    }

    function updateCatalog(player) {
      const content = document.getElementById('console-content');
      try {
        const manifest = player.getManifest();
        if (!manifest) { content.innerHTML = '<span class="console-label">No manifest available yet</span>'; return; }

        const tracks = player.getVariantTracks();
        const catalog = { version: 1, namespace, packaging: 'cmaf', tracks: [] };
        const seenVideo = new Set();
        const seenAudio = new Set();

        for (const t of tracks) {
          if (t.videoCodec && !seenVideo.has(t.videoId)) {
            seenVideo.add(t.videoId);
            const entry = { name: `video${seenVideo.size - 1}.m4s`, role: 'video', codec: t.videoCodec, width: t.width, height: t.height };
            if (t.frameRate) entry.framerate = t.frameRate;
            if (t.videoBandwidth) entry.bitrate = t.videoBandwidth;
            if (t.active) entry.active = true;
            catalog.tracks.push(entry);
          }
          if (t.audioCodec && !seenAudio.has(t.audioId)) {
            seenAudio.add(t.audioId);
            const entry = { name: `audio${seenAudio.size - 1}.m4s`, role: 'audio', codec: t.audioCodec };
            if (t.channelsCount) entry.channels = t.channelsCount;
            if (t.audioSamplingRate) entry.samplerate = t.audioSamplingRate;
            catalog.tracks.push(entry);
          }
        }

        const json = JSON.stringify(catalog, null, 2);
        content.innerHTML = `<span class="console-label">MSF Catalog (${catalog.tracks.length} tracks)</span>${escapeHtml(json)}`;
      } catch (e) {
        content.innerHTML = `<span class="console-label">Error reading catalog</span>${escapeHtml(e.message)}`;
      }
    }

    function escapeHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
