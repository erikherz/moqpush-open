<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>MoQpush super-admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0a; color: #e5e5e5; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid #1a1a1a; }
    .header h1 { font-size: 1.2em; font-weight: 500; display: flex; align-items: center; gap: 0.5rem; }
    .header h1 .logo-icon { width: 28px; height: 28px; filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.5)); }
    .header h1 .logo-text { background: linear-gradient(135deg, #60a5fa 0%, #34d399 50%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-links { display: flex; gap: 16px; }
    .header-links a { color: #737373; text-decoration: none; font-size: 0.9em; }
    .header-links a:hover { color: #e5e5e5; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
    .status-dot.on { background: #4ade80; }
    .status-dot.off { background: #ef4444; }
    .content { max-width: 1100px; margin: 0 auto; padding: 24px; }

    .section-title { font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.1em; color: #737373; margin: 24px 0 12px; font-weight: 600; }
    .section-title:first-child { margin-top: 0; }

    /* Puller grid */
    .puller-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .puller-card { background: #111; border: 1px solid #1a1a1a; border-radius: 8px; padding: 12px; }
    .puller-name { font-family: monospace; font-weight: 600; font-size: 0.95em; margin-bottom: 4px; }
    .puller-region { font-size: 0.75em; color: #737373; margin-bottom: 8px; }
    .puller-status { display: flex; align-items: center; gap: 6px; font-size: 0.8em; }
    .puller-ns { font-size: 0.7em; color: #888; margin-top: 6px; }
    .puller-ns .warm { color: #4ade80; }

    /* Namespace cards */
    .ns-card { border: 1px solid #1a1a1a; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
    .ns-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; cursor: pointer; background: #111; }
    .ns-header:hover { background: #171717; }
    .ns-name { font-family: monospace; font-weight: 600; }
    .ns-badges { display: flex; gap: 6px; }
    .badge { font-size: 0.65em; padding: 2px 6px; border-radius: 3px; font-weight: 600; text-transform: uppercase; }
    .badge.live { background: #166534; color: #4ade80; }
    .badge.offline { background: #1c1917; color: #525252; }
    .badge.warm { background: #1e3a5f; color: #60a5fa; }
    .chevron { color: #525252; transition: transform 0.2s; }
    .chevron.open { transform: rotate(90deg); }

    .ns-body { display: none; padding: 16px; border-top: 1px solid #1a1a1a; }
    .ns-body.open { display: block; }

    .warm-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .warm-node { background: #171717; border-radius: 6px; padding: 8px 10px; text-align: center; }
    .warm-node .node-name { font-family: monospace; font-size: 0.9em; margin-bottom: 2px; }
    .warm-node .node-status { font-size: 0.7em; }
    .warm-node .node-status.yes { color: #4ade80; }
    .warm-node .node-status.no { color: #525252; }
    .warm-node .node-status.pending { color: #fbbf24; }

    .owner-label { font-size: 0.75em; color: #737373; margin-bottom: 8px; }

    .empty { text-align: center; color: #525252; padding: 40px 0; }
    .key.hidden { filter: blur(5px); user-select: none; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>
        <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="48" fill="url(#oG)"/><path d="M30 25c5-3 15-5 20 0s10 10 5 18c-3 5-10 8-15 5s-12-8-15-13c-2-4 0-8 5-10z" fill="url(#lG)" opacity="0.9"/><path d="M55 30c8-2 18 2 22 10s2 20-8 25c-8 4-15 0-18-8s-4-15 0-20c2-4 6-6 4-7z" fill="url(#lG)" opacity="0.9"/><path d="M25 50c3-2 10-1 15 3s8 12 5 18c-2 5-8 8-14 6s-10-8-10-15c0-5 2-10 4-12z" fill="url(#lG)" opacity="0.9"/><path d="M60 60c5-1 12 2 15 8s2 14-5 18c-5 3-12 1-15-5s-3-12 0-16c2-3 3-4 5-5z" fill="url(#lG)" opacity="0.9"/><circle cx="50" cy="50" r="48" fill="none" stroke="url(#aG)" stroke-width="3" opacity="0.6"/><ellipse cx="35" cy="30" rx="12" ry="8" fill="white" opacity="0.15" transform="rotate(-30 35 30)"/><defs><linearGradient id="oG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e40af"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#0ea5e9"/></linearGradient><linearGradient id="lG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#22c55e"/><stop offset="100%" stop-color="#16a34a"/></linearGradient><linearGradient id="aG" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient></defs></svg>
        <span class="status-dot off" id="ws-dot"></span>
        <span class="logo-text">MoQpush</span> super-admin
      </h1>
    </div>
    <div class="header-links">
      <a href="/admin">My Namespaces</a>
      <a href="/admin/stats">Stats</a>
      <a href="/">Home</a>
    </div>
  </div>

  <div class="content">
    <div class="section-title">Puller Secret</div>
    <div style="margin-bottom:20px;">
      <span class="key hidden" id="puller-secret" onclick="this.classList.toggle('hidden');if(!this.classList.contains('hidden')){navigator.clipboard.writeText(this.textContent.trim())}" style="font-family:monospace;font-size:0.85em;color:#888;cursor:pointer;background:#111;padding:6px 12px;border-radius:6px;border:1px solid #1a1a1a;display:inline-block">Loading...</span>
      <span style="font-size:0.7em;color:#525252;margin-left:8px">Click to reveal and copy. Use as --secret or MOQPUSH_PULLER_SECRET env var.</span>
    </div>

    <div class="section-title">Puller Servers</div>
    <div class="puller-grid" id="puller-grid">
      <div class="empty">Connecting...</div>
    </div>

    <div class="section-title">All Namespaces</div>
    <div id="ns-list">
      <div class="empty">Loading...</div>
    </div>
  </div>

  <script>
    let pullerStatus = {};
    let namespaces = [];
    let broadcasts = {};
    let pullerWs = null;
    let statsWs = null;

    const KNOWN_NODES = ['naw', 'nae', 'eu1', 'in1'];

    function renderPullers() {
      const grid = document.getElementById('puller-grid');
      const nodes = KNOWN_NODES;
      grid.innerHTML = nodes.map(node => {
        const p = pullerStatus[node];
        const connected = !!p;
        const warmNs = p ? (p.warm_namespaces || []) : [];
        const activeNs = p ? (p.active_namespaces || []) : [];

        return `<div class="puller-card">
          <div class="puller-name">${node}.moqpush.com</div>
          <div class="puller-region">${p?.region || '—'}</div>
          <div class="puller-status">
            <span class="status-dot ${connected ? 'on' : 'off'}"></span>
            ${connected ? 'Connected' : 'Offline'}
          </div>
          ${activeNs.length > 0 ? `<div class="puller-ns">${activeNs.map(ns =>
            `<span class="${warmNs.includes(ns) ? 'warm' : ''}">${ns}${warmNs.includes(ns) ? ' ✓' : ' …'}</span>`
          ).join(', ')}</div>` : ''}
        </div>`;
      }).join('');
    }

    function renderNamespaces() {
      const list = document.getElementById('ns-list');
      if (namespaces.length === 0) {
        list.innerHTML = '<div class="empty">No namespaces</div>';
        return;
      }

      list.innerHTML = namespaces.map(ns => {
        const isLive = !!broadcasts[ns.namespace];
        const regions = ns.regions || [];

        // Build warm status per region
        const warmInfo = regions.map(node => {
          const p = pullerStatus[node];
          if (!p) return { node, status: 'offline' };
          if (p.warm_namespaces?.includes(ns.namespace)) return { node, status: 'warm' };
          if (p.active_namespaces?.includes(ns.namespace)) return { node, status: 'pending' };
          return { node, status: 'idle' };
        });

        const warmCount = warmInfo.filter(w => w.status === 'warm').length;
        const allWarm = regions.length > 0 && warmCount === regions.length;

        return `<div class="ns-card" data-ns="${ns.namespace}">
          <div class="ns-header" onclick="toggleNs('${ns.namespace}')">
            <div style="display:flex;align-items:center;gap:10px">
              <span class="chevron" id="chev-${ns.namespace}">&#9654;</span>
              <span class="ns-name">${ns.namespace}</span>
            </div>
            <div class="ns-badges">
              <span class="badge ${isLive ? 'live' : 'offline'}">${isLive ? 'LIVE' : 'OFF'}</span>
              ${regions.length > 0 ? `<span class="badge ${allWarm ? 'warm' : 'offline'}">${warmCount}/${regions.length} WARM</span>` : ''}
            </div>
          </div>
          <div class="ns-body" id="body-${ns.namespace}">
            <div class="owner-label">Owner: ${ns.owner_email} · Regions: ${regions.join(', ') || 'none'}</div>
            ${regions.length > 0 ? `<div class="warm-grid">${warmInfo.map(w => `
              <div class="warm-node">
                <div class="node-name">${w.node}</div>
                <div class="node-status ${w.status === 'warm' ? 'yes' : w.status === 'pending' ? 'pending' : 'no'}">
                  ${w.status === 'warm' ? 'WARM' : w.status === 'pending' ? 'CONNECTING' : w.status === 'offline' ? 'OFFLINE' : 'IDLE'}
                </div>
              </div>
            `).join('')}</div>` : '<div class="empty" style="padding:16px 0">No regions configured</div>'}
          </div>
        </div>`;
      }).join('');
    }

    function toggleNs(ns) {
      const body = document.getElementById('body-' + ns);
      const chev = document.getElementById('chev-' + ns);
      if (!body) return;
      const isOpen = body.classList.toggle('open');
      if (chev) chev.classList.toggle('open', isOpen);
    }

    // Fetch namespaces from admin API
    async function loadNamespaces() {
      try {
        const resp = await fetch('/api/admin/namespaces');
        const data = await resp.json();
        namespaces = data.namespaces || [];
        renderNamespaces();
      } catch {}
    }

    // Fetch live broadcasts
    async function loadBroadcasts() {
      try {
        const resp = await fetch('/api/broadcasts');
        const data = await resp.json();
        broadcasts = {};
        for (const b of data.broadcasts || []) {
          broadcasts[b.namespace] = b;
        }
        renderNamespaces();
      } catch {}
    }

    function connectPullerWs() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      pullerWs = new WebSocket(proto + '//' + location.host + '/api/pullers/status/ws');
      pullerWs.onopen = () => {
        document.getElementById('ws-dot').className = 'status-dot on';
      };
      pullerWs.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'status') {
          pullerStatus = msg.pullers || {};
          renderPullers();
          renderNamespaces();
        }
      };
      pullerWs.onclose = () => {
        document.getElementById('ws-dot').className = 'status-dot off';
        setTimeout(connectPullerWs, 3000);
      };
      pullerWs.onerror = () => pullerWs.close();
    }

    async function loadPullerSecret() {
      try {
        const resp = await fetch('/api/admin/puller-secret');
        const data = await resp.json();
        document.getElementById('puller-secret').textContent = data.secret || '(not set)';
      } catch {}
    }

    // Auth check + init
    fetch('/api/auth/me').then(r => r.json()).then(d => {
      if (!d.authenticated) {
        document.querySelector('.content').innerHTML =
          '<div class="empty">Not authenticated. <a href="/admin" style="color:#667eea">Sign in</a></div>';
        return;
      }
      loadNamespaces();
      loadBroadcasts();
      loadPullerSecret();
      connectPullerWs();
      // Refresh broadcasts every 10s
      setInterval(loadBroadcasts, 10000);
    });
  </script>
</body>
</html>
