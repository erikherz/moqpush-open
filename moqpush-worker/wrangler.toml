name = "moqpush"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Static assets
assets = { directory = "./public", binding = "ASSETS" }

# Custom domain
routes = [
  { pattern = "moqpush.com", custom_domain = true },
  { pattern = "www.moqpush.com", custom_domain = true }
]

# KV Namespace (sessions, oauth_state, locks)
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# D1 Database (users, namespaces, pullers)
[[d1_databases]]
binding = "DB"
database_name = "moqpush"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Durable Object for real-time stats aggregation
[durable_objects]
bindings = [
  { name = "STATS_HUB", class_name = "StatsHub" },
  { name = "PULLER_HUB", class_name = "PullerHub" },
]

[[migrations]]
tag = "v1"
new_classes = ["StatsHub"]

[[migrations]]
tag = "v2"
new_classes = ["PullerHub"]
